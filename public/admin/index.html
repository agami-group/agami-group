<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agami Group — Site admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F5F3; --surface:#FFFFFF; --sunk:#E8ECEA; --ink:#121A21; --ink-2:#46525D; --ink-3:#6F7A83;
  --line:#D5DBD9; --accent:#1F4E5F; --accent-ink:#FFFFFF; --accent-soft:#DCE8EB; --plate:#E8B923; --bad:#B3261E; --good:#2E7D4F;
  --display:"Roboto Slab", Georgia, serif; --body:"Figtree","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);font-weight:300;margin:0;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:3px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
a.btn{color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.55;cursor:default}
.btn.small{padding:5px 10px;font-size:13px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:32px;width:100%;max-width:380px;display:grid;gap:16px}
.login h1{font-size:28px}
.login input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;background:var(--ground)}
.err{color:var(--bad);font-size:14px;min-height:1.2em}

/* Editor */
.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;margin-right:auto}
.state{font-size:13px;color:var(--ink-3)}
.state.dirty{color:#8a6200}
.state.ok{color:var(--good)}
.state.bad{color:var(--bad)}
.layout{max-width:1180px;margin:auto;padding:24px 16px 80px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.side{position:sticky;top:76px;align-self:start;display:grid;gap:2px}
.side a{padding:7px 10px;border-radius:3px;text-decoration:none;color:var(--ink-2);display:flex;justify-content:space-between}
.side a:hover{background:var(--sunk);color:var(--ink)}
.side a b{font-weight:500;font-size:11px;color:#8a6200}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);margin-bottom:10px}
.tip{background:var(--accent-soft);border-radius:4px;padding:12px 14px;font-size:14px;color:var(--ink);margin-bottom:24px}
.tip code{font-family:var(--mono);font-size:13px;background:var(--surface);padding:1px 5px;border-radius:2px}
.group{margin-bottom:36px;scroll-margin-top:80px}
.group h2{font-size:24px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.fields{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.field{display:grid;grid-template-columns:90px minmax(0,1fr);gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field .k{padding-top:9px}
.field textarea{width:100%;resize:vertical;min-height:40px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--ground);line-height:1.45}
.field.changed textarea{border-color:var(--plate);background:color-mix(in srgb,var(--plate) 8%,var(--surface))}
.field .meta{display:flex;gap:10px;align-items:center;margin-top:5px;font-size:12px;color:var(--ink-3)}
.field .meta .orig{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.team{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:10px;margin-bottom:14px}
.trow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center}
.trow .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display)}
.trow input{padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:var(--ground);width:100%}
.trow .acts{display:flex;gap:4px}
.icon{width:32px;height:32px;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer}
.icon:hover{border-color:var(--ink-3)}
.icon.rm:hover{color:var(--bad);border-color:var(--bad)}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{display:none}.field{grid-template-columns:1fr;gap:4px}.field .k{padding-top:0}.trow{grid-template-columns:36px 1fr;}.trow input:nth-of-type(2){grid-column:2}.trow .acts{grid-column:2}}
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="loginView">
  <form id="loginForm">
    <p class="mono">Agami Group</p>
    <h1>Site admin</h1>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" id="loginErr" aria-live="polite"></p>
  </form>
</div>

<!-- Editor -->
<div id="editView" hidden>
  <header class="top">
    <div class="in">
      <h1>Agami Group · Site admin</h1>
      <span class="state" id="state" aria-live="polite">No changes</span>
      <a class="btn" href="/" target="_blank" rel="noopener">View site ↗</a>
      <button class="btn" type="button" id="logout">Sign out</button>
      <button class="btn primary" type="button" id="save" disabled>Save &amp; publish</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main>
      <input class="search" id="search" type="search" placeholder="Search text on the site…">
      <p class="tip">Change any text and press <b>Save &amp; publish</b>. The live site updates within about a minute.
        Put words between stars to colour them: <code>run *all your operations* in Israel</code>. Press Enter for a new line.</p>
      <div id="groups"></div>
    </main>
  </div>
</div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const SECTION_NAMES = {nav:'Top menu', hero:'Hero', challenges:'Challenges', services:'Services', transparency:'Cost transparency', process:'How we work', team:'Team', contact:'Contact', footer:'Footer'};
  let password = '', FIELDS = [], DEFAULT_TEAM = [], team = [], saved = '';

  try { password = sessionStorage.getItem('agami-admin') || ''; } catch(e) {}

  async function api(method, body){
    const r = await fetch('/api/admin', {method, headers:{'Content-Type':'application/json','X-Admin-Password':password}, body: body ? JSON.stringify(body) : undefined});
    let data = null; try { data = await r.json(); } catch(e) {}
    if (!r.ok) throw Object.assign(new Error((data && data.error) || ('Error ' + r.status)), {status:r.status});
    return data;
  }

  async function start(){
    $('#loginErr').textContent = '';
    try {
      const [defs, content] = await Promise.all([fetch('/admin/fields.json').then(r => r.json()), api('GET')]);
      try { sessionStorage.setItem('agami-admin', password); } catch(e) {}
      FIELDS = defs.fields; DEFAULT_TEAM = defs.team;
      build(content);
      $('#loginView').hidden = true; $('#editView').hidden = false;
      document.querySelectorAll('.field textarea').forEach(grow);
    } catch(e){
      try { sessionStorage.removeItem('agami-admin'); } catch(_) {}
      $('#loginView').hidden = false; $('#editView').hidden = true;
      if (password) $('#loginErr').textContent = e.status === 401 ? 'Wrong password.' : e.message;
    }
  }

  $('#loginForm').addEventListener('submit', e => { e.preventDefault(); password = $('#pw').value; start(); });
  $('#logout').addEventListener('click', () => { try { sessionStorage.removeItem('agami-admin'); } catch(e) {} location.reload(); });

  function build(content){
    const text = content.text || {};
    team = (content.team && content.team.length ? content.team : DEFAULT_TEAM).map(p => ({...p}));
    const bySec = {};
    FIELDS.forEach(f => (bySec[f.section] = bySec[f.section] || []).push(f));
    const order = ['nav','hero','challenges','services','transparency','process','team','contact','footer'].filter(s => bySec[s]);

    $('#side').innerHTML = order.map(s => `<a href="#g-${s}" data-sec="${s}">${SECTION_NAMES[s]||s}<b></b></a>`).join('');
    $('#groups').innerHTML = order.map(s => `
      <section class="group" id="g-${s}">
        <h2>${SECTION_NAMES[s]||s} <span class="mono">${bySec[s].length} texts</span></h2>
        ${s === 'team' ? '<div class="team" id="team"></div>' : ''}
        <div class="fields">${bySec[s].map(f => `
          <div class="field" data-key="${f.key}">
            <span class="k mono">${f.key}</span>
            <div>
              <textarea rows="1" aria-label="${escAttr(f.value)}"></textarea>
              <div class="meta"><span class="orig" hidden>Original: ${escHtml(f.value)}</span><button class="linkbtn" type="button" hidden>Restore original</button></div>
            </div>
          </div>`).join('')}</div>
      </section>`).join('');

    document.querySelectorAll('.field').forEach(row => {
      const f = FIELDS.find(x => x.key === row.dataset.key);
      const ta = row.querySelector('textarea');
      ta.value = text[f.key] != null ? text[f.key] : f.value;
      grow(ta);
      ta.addEventListener('input', () => { grow(ta); mark(row); update(); });
      row.querySelector('.linkbtn').addEventListener('click', () => { ta.value = f.value; grow(ta); mark(row); update(); });
      mark(row);
    });
    renderTeam();
    saved = JSON.stringify(collect());
    update();
  }

  function renderTeam(){
    const box = $('#team');
    box.innerHTML = '<p class="mono" style="margin:0">People shown on the site</p>' + team.map((p,i) => `
      <div class="trow" data-i="${i}">
        <span class="av" aria-hidden="true">${escHtml((p.name||'?').trim().charAt(0).toUpperCase()||'?')}</span>
        <input type="text" value="${escAttr(p.name)}" placeholder="Name" aria-label="Name" data-f="name">
        <input type="text" value="${escAttr(p.role)}" placeholder="Role" aria-label="Role" data-f="role">
        <span class="acts">
          <button class="icon" type="button" data-a="up" aria-label="Move up" ${i===0?'disabled':''}>↑</button>
          <button class="icon" type="button" data-a="down" aria-label="Move down" ${i===team.length-1?'disabled':''}>↓</button>
          <button class="icon rm" type="button" data-a="rm" aria-label="Remove">×</button>
        </span>
      </div>`).join('') + '<div><button class="btn small" type="button" id="addP">+ Add person</button></div>';
  }
  document.addEventListener('input', e => {
    const inp = e.target.closest('.trow input'); if (!inp) return;
    const i = +inp.closest('.trow').dataset.i; team[i][inp.dataset.f] = inp.value;
    if (inp.dataset.f === 'name') inp.closest('.trow').querySelector('.av').textContent = (inp.value.trim().charAt(0) || '?').toUpperCase();
    update();
  });
  document.addEventListener('click', e => {
    if (e.target.closest('#addP')){ team.push({name:'', role:''}); renderTeam(); const rows = document.querySelectorAll('#team .trow'); rows[rows.length-1].querySelector('input').focus(); update(); return; }
    const b = e.target.closest('.trow .icon'); if (!b) return;
    const i = +b.closest('.trow').dataset.i, a = b.dataset.a;
    if (a === 'rm') team.splice(i,1);
    if (a === 'up' && i > 0) [team[i-1], team[i]] = [team[i], team[i-1]];
    if (a === 'down' && i < team.length-1) [team[i+1], team[i]] = [team[i], team[i+1]];
    renderTeam(); update();
  });

  function mark(row){
    const f = FIELDS.find(x => x.key === row.dataset.key);
    const changed = row.querySelector('textarea').value.trim() !== f.value.trim();
    row.classList.toggle('changed', changed);
    row.querySelector('.orig').hidden = !changed;
    row.querySelector('.linkbtn').hidden = !changed;
  }
  function grow(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }

  function collect(){
    const text = {};
    document.querySelectorAll('.field').forEach(row => {
      const f = FIELDS.find(x => x.key === row.dataset.key);
      const v = row.querySelector('textarea').value.trim();
      if (v && v !== f.value.trim()) text[f.key] = v;
    });
    return {text, team: team.map(p => ({name:(p.name||'').trim(), role:(p.role||'').trim()})).filter(p => p.name)};
  }
  function update(){
    const dirty = JSON.stringify(collect()) !== saved;
    $('#save').disabled = !dirty;
    const st = $('#state'); st.className = 'state' + (dirty ? ' dirty' : '');
    if (dirty || !st.dataset.hold) st.textContent = dirty ? 'Unsaved changes' : 'No changes';
    document.querySelectorAll('#side a').forEach(a => {
      const n = document.querySelectorAll('#g-' + a.dataset.sec + ' .field.changed').length;
      a.querySelector('b').textContent = n ? n + ' edited' : '';
    });
  }

  $('#save').addEventListener('click', async () => {
    const data = collect(), st = $('#state'), btn = $('#save');
    btn.disabled = true; st.className = 'state'; st.textContent = 'Saving…';
    try {
      await api('POST', data);
      saved = JSON.stringify(data);
      st.className = 'state ok'; st.textContent = 'Published — live within about a minute';
      st.dataset.hold = '1'; setTimeout(() => { delete st.dataset.hold; update(); }, 6000);
      $('#save').disabled = true;
    } catch(e){
      st.className = 'state bad'; st.textContent = e.status === 401 ? 'Session expired — sign in again' : 'Not saved: ' + e.message;
      btn.disabled = false;
    }
  });

  window.addEventListener('beforeunload', e => { if (!$('#save').disabled) { e.preventDefault(); e.returnValue = ''; } });

  $('#search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.field').forEach(row => {
      row.hidden = q && !(row.querySelector('textarea').value.toLowerCase().includes(q) || row.dataset.key.includes(q));
    });
    document.querySelectorAll('.group').forEach(g => { g.hidden = q && !g.querySelector('.field:not([hidden])'); });
  });

  function escHtml(s){ return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function escAttr(s){ return escHtml(s).replace(/"/g,'&quot;'); }

  if (password) start();
})();
</script>
</body>
</html>
